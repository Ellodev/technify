apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: technify
data:
  REFRESH_INTERVAL_MINUTES: "15"
  MAX_ARTICLE_AGE_DAYS: "14"
  VAPID_SUBJECT: "mailto:admin@technify.local"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technify-data
  namespace: technify
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: technify
spec:
  # SQLite on a RWO volume: keep a single replica. Swap the store for
  # Postgres before scaling this out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ellodev/technify-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          # Optional: provide stable VAPID keys via a secret:
          #   kubectl -n technify create secret generic vapid --from-literal=VAPID_PRIVATE_KEY="$(cat vapid_private.pem)"
          # then uncomment:
          # env:
          #   - name: VAPID_PRIVATE_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: vapid
          #         key: VAPID_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: technify-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: technify
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
