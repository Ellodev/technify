apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: technify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Build with: docker build --build-arg API_URL=http://backend:8000 ./website
          image: ghcr.io/ellodev/technify-web:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: technify
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
